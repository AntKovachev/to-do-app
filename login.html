<!DOCTYPE html>
<html lang="en">
<head>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="icon" type="image/x-icon" href="favicon32.png">
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
</head>
<body class="bg-light">
    <header class="bg-primary py-3">
        <nav class="container navbar navbar-expand-lg navbar-dark">
            <div class="d-flex align-items-center">
                <img src="https://img.icons8.com/?size=100&id=oYhzeDCgzsVo&format=png&color=000000"
                     alt="Icon"
                     class="me-2"
                     style="width: 25px; height: 25px; margin-top: 5px"/>
                <a href="/" class="navbar-brand fw-bold fs-4">To Do</a>
            </div>
            <div class="ms-auto">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a href="/login" class="nav-link text-light fw-bold fs-4">Login</a>
                    </li>
                    <li class="nav-item">
                        <a href="/register" class="nav-link text-light fw-bold fs-4">Register</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>
    <main class="container mt-5">
        <div class="container text-center" style="max-width: 50vh;">
            <h2>Login</h2>
            <form action="/login" method="POST">
                <div class="mb-3">
                    <input type="email" name="email" class="form-control" placeholder="Email" required />
                </div>
                <div class="mb-3">
                    <input type="password" name="password" class="form-control" placeholder="Password" required />
                </div>
                <button type="submit" class="btn btn-primary">Register</button>
            </form>
        </div>
    </main>
</body>
</html>
